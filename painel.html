/span></div><div class="darkbody"><p>Do briefing ao relatório: veja como cada informação chega ao lugar certo.</p>${btn('Explorar automações',"go('automations')",false,'arrow')}</div></section></div><div class="grid"><section class="card">${head('Vagas em destaque','Os próximos passos do seu recrutamento.',link('Todas as vagas','jobs'))}<div class="tablewrap"><table><thead><tr><th>Vaga / cliente</th><th>Status</th><th>Candidatos</th><th></th></tr></thead><tbody>${j.slice(0,4).map(x=>`<tr><td><strong>${esc(x.title)}</strong><small>${esc(x.client)}</small></td><td>${badge(x.status)}</td><td>${x.interviews} entrevistados</td><td><button class="iconbtn" aria-label="Abrir vaga ${esc(x.title)}" onclick="jobDetail(${x.id})">${ic('arrow')}</button></td></tr>`).join('')||'<tr><td colspan="4">Nenhuma vaga neste mês.</td></tr>'}</tbody></table></div></section><section class="card">${head('Seu foco agora','Pequenas ações para a operação seguir.')}<label class="task ${state.tasks[0]?'done':''}"><input type="checkbox" ${state.tasks[0]?'checked':''} onchange="toggleTask(0,this.checked)"><span>Revisar relato da consultoria<small>Amorim · Encontro de 23 out</small></span></label><label class="task ${state.tasks[1]?'done':''}"><input type="checkbox" ${state.tasks[1]?'checked':''} onchange="toggleTask(1,this.checked)"><span>Confirmar briefing com o cliente<small>Flavine · Assistente administrativo</small></span></label><label class="task ${state.tasks[2]?'done':''}"><input type="checkbox" ${state.tasks[2]?'checked':''} onchange="toggleTask(2,this.checked)"><span>Separar material do treinamento<small>Amorim · 28 out, às 9h</small></span></label><div class="cardfooter"><span>${state.tasks.filter(Boolean).length} de 3 tarefas concluídas</span><button class="link" onclick="go('protocol')">Ver passo a passo →</button></div></section></div><section class="card">${head('A operação, acontecendo','Registros e automações em uma linha do tempo.',link('Ver fluxos','automations'))}${(state.logs.length?state.logs.slice(0,3):[{t:'Relato de consultoria pronto para revisão',d:'Amorim · Demonstração de resumo estruturado'},{t:'Briefing recebido e vaga organizada',d:'Flavine · Assistente administrativo · Exemplo do Google Forms'}]).map((l,i)=>`<div class="activity"><div class="symbol">${ic(i?'jobs':'bolt')}</div><div><strong>${esc(l.t)}</strong><small>${esc(l.d)}</small></div><time>${state.logs.length?'Nesta sessão':'Exemplo'}</time></div>`).join('')}</section>`}
function toggleTask(i,v){state.tasks[i]=v;save();render()}function toolbar(extra=''){return `<div class="toolbar"><div class="search">${ic('search')}<input aria-label="Buscar registros" id="search" placeholder="Buscar por nome ou cliente..." value="${esc(query)}" oninput="query=this.value;updateResults()"></div>${extra}</div>`}function updateResults(){let el=document.getElementById('results');el.innerHTML=view==='jobs'?jobBoard():view==='library'?libraryCards():view==='clients'?clientCards():meetingTable()}
function jobs(){return intro('RECRUTAMENTO & SELEÇÃO','Cada vaga, no seu lugar.','Briefings, requisitos e candidatos organizados do início ao fim.',btn('Simular briefing',"simulate(0)",false,'bolt')+btn('Nova vaga','jobForm()',true,'plus'))+toolbar(`<select aria-label="Filtrar status" onchange="jobStatus=this.value;updateResults()"><option value="">Todos os status</option>${['Aberta','Em andamento','Fechada'].map(s=>`<option>${s}</option>`).join('')}</select>`)+`<div id="results">${jobBoard()}</div>`}
function jobBoard(){let all=state.jobs.filter(j=>(!jobStatus||j.status===jobStatus)&&(j.title+' '+j.client).toLowerCase().includes(query.toLowerCase()));return `<div class="kanban">${['Aberta','Em andamento','Fechada'].map((s,i)=>`<section class="column"><div class="colhead"><span><span class="dot" style="opacity:${1-i*.3}"></span>${s==='Aberta'?'Abertas':s==='Fechada'?'Fechadas':s}</span><span>${all.filter(j=>j.status===s).length}</span></div>${all.filter(j=>j.status===s).map(j=>`<button class="job" onclick="jobDetail(${j.id})"><span class="badge">${esc(j.client)}</span><h3>${esc(j.title)}</h3><p>${money(j.salary)} · ${j.quantity} ${j.quantity>1?'posições':'posição'}</p><div class="jobbottom"><span>${j.interviews} entrevistas</span><span>${money(j.value)} / vaga ↗</span></div></button>`).join('')||'<p class="empty">Nenhuma vaga aqui.</p>'}</section>`).join('')}</div>`}
function clientPage(){return intro('RELACIONAMENTO','Conheça o histórico completo.','Tudo o que foi feito por cada empresa, sem procurar em conversas.')+toolbar()+`<div class="cards3" id="results">${clientCards()}</div>`}function clientCards(){return clients.filter(c=>c.toLowerCase().includes(query.toLowerCase())).map(c=>`<section class="card client"><div class="letter">${c[0]}</div><h2>${c}</h2><p style="margin-top:8px">Recrutamento · Consultoria${c==='Amorim'||c==='DEDARC'?' · Treinamentos':''}</p><hr><div class="minirow"><span>Vagas em aberto</span><b>${state.jobs.filter(x=>x.client===c&&x.status!=='Fechada').length}</b></div><div class="minirow"><span>Encontros registrados</span><b>${state.meetings.filter(x=>x.client===c).length}</b></div><div class="minirow"><span>Responsável</span><span>Raffaella</span></div>${btn('Abrir histórico',`clientDetail('${c}')`,false,'arrow')}</section>`).join('')||'<p class="empty">Nenhuma empresa encontrada.</p>'}
function meetings(){return intro('CONSULTORIA','Nenhum encontro se perde.','Registre a conversa, a ferramenta aplicada e o próximo passo.',btn('Simular pós-encontro','simulate(2)',false,'bolt')+btn('Registrar encontro','meetingForm()',true,'plus'))+toolbar(`<select aria-label="Filtrar por cliente" onchange="clientFilter=this.value;updateResults()"><option value="">Todos os clientes</option>${clients.map(c=>`<option>${c}</option>`).join('')}</select>`)+`<div id="results">${meetingTable()}</div>`}function meetingTable(){let ms=state.meetings.filter(m=>(!clientFilter||m.client===clientFilter)&&(m.topic+' '+m.client).toLowerCase().includes(query.toLowerCase()));return `<div class="card tablewrap"><table><thead><tr><th>Encontro</th><th>Cliente</th><th>Data</th><th>Situação</th><th></th></tr></thead><tbody>${ms.map(m=>`<tr><td><strong>${esc(m.topic)}</strong><small>${esc(m.tool)}</small></td><td>${esc(m.client)}</td><td>${date(m.date)}</td><td>${badge(m.status)}</td><td>${btn(m.status==='A revisar'?'Revisar relato':'Ver registro',`meetingDetail(${m.id})`)}</td></tr>`).join('')||'<tr><td colspan="5">Nenhum encontro encontrado.</td></tr>'}</tbody></table></div>`}
function training(){return intro('DESENVOLVIMENTO','Treinamentos com propósito.','Planeje as próximas turmas e acompanhe o que já foi entregue.',btn('Novo treinamento','trainingForm()',true,'plus'))+`<div class="cards3">${state.trainings.map((t,i)=>`<section class="card client">${badge(t.status)}<h2 style="margin-top:22px;line-height:1.5">${esc(t.topic)}</h2><p style="margin-top:9px">${esc(t.client)} · ${esc(t.place)}</p><hr><div class="minirow"><span>Data</span><b>${date(t.date)}</b></div><div class="minirow"><span>Participantes</span><b>${t.people}</b></div><p>Material: ${esc(t.material)}</p>${btn('Ver treinamento',`trainingDetail(${i})`,false,'arrow')}</section>`).join('')}</div>`}
const docs=[{name:'Roda de competências',cat:'RH',desc:'Modelo de diagnóstico e plano de desenvolvimento.'},{name:'Roteiro de entrevista',cat:'Recrutamento',desc:'Perguntas e critérios para uma entrevista estruturada.'},{name:'Briefing de nova vaga',cat:'Briefing',desc:'Informações essenciais para iniciar uma seleção.'},{name:'Ficha de perfil comportamental',cat:'Testes',desc:'Ficha ilustrativa para organizar observações, sem avaliação psicológica.'},{name:'Matriz de responsabilidades',cat:'RH',desc:'Organize as atribuições e os responsáveis da equipe.'},{name:'Roteiro de feedback',cat:'RH',desc:'Prepare uma conversa com observações e próximos passos.'}];
function library(){return intro('BIBLIOTECA','A ferramenta certa, à mão.','Materiais organizados por categoria, prontos para consultar e imprimir.')+`<div class="helpnote">Os materiais abaixo são modelos demonstrativos. Na versão conectada, os PDFs e testes da Ômega entram neste espaço.</div>`+toolbar(`<select aria-label="Filtrar categoria" onchange="category=this.value;updateResults()"><option value="">Todas as categorias</option>${['RH','Recrutamento','Briefing','Testes'].map(x=>`<option ${category===x?'selected':''}>${x}</option>`).join('')}</select>`)+`<div class="cards3" id="results">${libraryCards()}</div>`}function libraryCards(){return docs.map((d,i)=>({...d,i})).filter(d=>(!category||d.cat===category)&&(d.name+' '+d.cat).toLowerCase().includes(query.toLowerCase())).map(d=>`<section class="card client"><div class="letter">${ic('report')}</div><span class="badge">${d.cat}</span><h3 style="margin-top:18px">${d.name}</h3><p>${d.desc}</p>${btn('Abrir modelo',`docDetail(${d.i})`,false,'arrow')}</section>`).join('')||'<p class="empty">Nenhum material encontrado.</p>'}
const flows=[['Briefing → vaga','O cliente preenche o formulário. A vaga nasce organizada e a assistente é avisada.',['Google Forms','Nova vaga','Aviso à Lari'],'Simular chegada de briefing'],['Repetir uma vaga','Recupere salário e requisitos de uma vaga antiga. Confirme apenas o que mudou.',['Vaga anterior','Cópia','Confirmação'],'Escolher vaga para repetir'],['Relato pós-encontro','Ao final da visita, uma pergunta no WhatsApp transforma o relato em registro para revisão.',['Agenda','WhatsApp + IA','Revisão'],'Simular pós-encontro'],['Preparação da próxima visita','Antes do encontro, receba a pauta anterior e o próximo passo combinado.',['Histórico','Próxima visita','Lembrete'],'Ver lembrete de exemplo'],['Resumo mensal','No dia 1, os números do mês anterior chegam organizados para a Raffaella.',['Dados do mês','Resumo','WhatsApp'],'Gerar resumo de exemplo'],['Relatório do cliente','Escolha a empresa e o período para reunir encontros, faltas e vagas em um relatório.',['Cliente + período','Linha do tempo','PDF'],'Montar relatório']];
function automations(){return intro('FLUXOS INTELIGENTES','Menos tarefas. Mais continuidade.','Veja o caminho de cada automação e experimente o resultado.')+`<div class="helpnote">Modo demonstração: os fluxos são simulados. Nenhuma mensagem é enviada e nenhum serviço externo está conectado.</div><div class="flowlist">${flows.map((f,i)=>`<section class="card flow"><div class="flowtop"><div class="symbol">${ic('bolt')}</div><button class="badge ${state.auto[i]?'dark':''}" onclick="state.auto[${i}]=!state.auto[${i}];save();render()" aria-label="${state.auto[i]?'Pausar':'Ativar'} demonstração ${esc(f[0])}">${state.auto[i]?'● Habilitada na demo':'○ Pausada na demo'}</button></div><h3>${f[0]}</h3><p>${f[1]}</p><div class="flowroute">${f[2].map((s,n)=>`${n?'<b>→</b>':''}<span>${s}</span>`).join('')}</div><button class="btn" ${!state.auto[i]?'disabled':''} onclick="simulate(${i})">${f[3]} ${ic('arrow')}</button></section>`).join('')}</div>`}
function reports(){return intro('RESULTADOS VISÍVEIS','O trabalho aparece aqui.','Escolha o cliente e o período para transformar registros em uma visão organizada.')+`<section class="card wide"><div class="eyebrow">RELATÓRIO DE ATIVIDADES</div><h2>Uma linha do tempo para o seu cliente.</h2><p style="font-size:12px;margin:10px 0 25px">Vagas, encontros, ferramentas e treinamentos no mesmo documento.</p><div class="toolbar"><select id="reportClient" aria-label="Cliente do relatório">${clients.map(c=>`<option>${c}</option>`).join('')}</select><input type="date" id="reportStart" aria-label="Data inicial" value="2026-10-01"><input type="date" id="reportEnd" aria-label="Data final" value="2026-10-31">${btn('Gerar relatório','makeReport()',true,'report')}</div><p style="font-size:11px">Dados de demonstração. A impressão permite salvar o relatório em PDF.</p></section>`}
function protocol(){return intro('CONTINUIDADE DA OPERAÇÃO','Um caminho claro para a assistente.','Passos organizados para que o trabalho continue, com quem estiver na equipe.')+`<div class="grid"><section class="card wide"><div class="eyebrow">ROTINA DIÁRIA</div><h2>Comece por aqui</h2>${[['Olhe a visão geral','Confira as pendências e os registros que precisam de revisão.'],['Confira os novos briefings','Valide salário, requisitos e valor cobrado antes de iniciar a seleção.'],['Atualize os processos','Registre candidatos enviados, entrevistas e o status de cada vaga.'],['Revise os relatos das visitas','Confirme pauta, ferramenta, presença e próximo passo com a Raffaella.'],['Prepare o dia seguinte','Confira treinamentos, próximos encontros e materiais necessários.']].map((s,i)=>`<div class="step"><div class="stepnum">${i+1}</div><div><h3>${s[0]}</h3><p>${s[1]}</p></div></div>`).join('')}</section><section class="card wide"><div class="eyebrow">ATALHOS DA ROTINA</div><h2>Um passo de cada vez.</h2><div style="display:grid;gap:14px;margin-top:24px">${btn('Conferir vagas',"go('jobs')",false,'jobs')}${btn('Revisar consultorias',"go('meetings')",false,'calendar')}${btn('Encontrar uma ferramenta',"go('library')",false,'book')}</div><div class="notice" style="margin-top:25px">Na versão final, este espaço também pode reunir os mapas e protocolos internos da Raffaella.</div>${btn('Reiniciar dados de exemplo','resetDemo()',false,'copy')}</section></div>`}
function modal(title,html){lastFocus=document.activeElement;document.getElementById('overlay').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="dialogtitle"><header class="modalhead"><h2 id="dialogtitle">${title}</h2><button class="iconbtn" aria-label="Fechar" onclick="closeModal()">${ic('close')}</button></header><div class="modalbody">${html}</div></section></div>`;document.querySelectorAll('.modalbody label').forEach(l=>{const el=l.nextElementSibling;if(el&&el.id&&/INPUT|SELECT|TEXTAREA/.test(el.tagName))l.htmlFor=el.id});document.body.style.overflow='hidden';document.querySelector('.modalhead button').focus()}
function closeModal(){document.getElementById('overlay').innerHTML='';document.body.style.overflow='';lastFocus?.focus()}document.addEventListener('keydown',e=>{const m=document.querySelector('.modal');if(!m)return;if(e.key==='Escape')closeModal();if(e.key==='Tab'){let fs=[...m.querySelectorAll('button,input,select,textarea,a')].filter(x=>!x.disabled);if(e.shiftKey&&document.activeElement===fs[0]){e.preventDefault();fs.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===fs.at(-1)){e.preventDefault();fs[0].focus()}}});let toastTimer;function toast(s){document.getElementById('toast').textContent=s;clearTimeout(toastTimer);toastTimer=setTimeout(()=>document.getElementById('toast').textContent='',4000)}
function newMenu(){modal('O que vamos registrar?',`<p>Escolha o tipo de registro para continuar.</p><div style="display:grid;gap:15px;margin-top:25px">${btn('Nova vaga','jobForm()',true,'jobs')}${btn('Encontro de consultoria','meetingForm()',false,'calendar')}${btn('Treinamento','trainingForm()',false,'training')}</div>`)}
function jobDetail(id){const j=state.jobs.find(x=>x.id===id);modal(esc(j.title),`<span class="badge">${esc(j.client)}</span><p style="margin-top:18px">Criada em ${date(j.date)} · ${j.quantity} posição(ões)</p><div class="fieldgrid"><div><label>Salário oferecido</label><h3>${money(j.salary)}</h3></div><div><label>Valor cobrado por vaga</label><h3>${money(j.value)}</h3></div></div><label>Requisitos e briefing</label><div class="chat">${esc(j.req)}</div><div class="fieldgrid"><div><label>Candidatos enviados</label><input id="sent" type="number" min="0" value="${j.sent}"></div><div><label>Entrevistados</label><input id="interviews" type="number" min="0" value="${j.interviews}"></div></div><label>Status da vaga</label><select id="jobState">${['Aberta','Em andamento','Fechada'].map(s=>`<option ${j.status===s?'selected':''}>${s}</option>`).join('')}</select><div class="modalactions">${btn('Repetir vaga',`jobForm(${id})`,false,'copy')}${btn('Salvar alterações',`saveJob(${id})`,true,'check')}</div>`)}
function saveJob(id){let j=state.jobs.find(x=>x.id===id),sent=+document.getElementById('sent').value,interviews=+document.getElementById('interviews').value;if(!Number.isInteger(sent)||!Number.isInteger(interviews)||sent<0||interviews<0)return toast('Informe quantidades inteiras e positivas.');Object.assign(j,{status:document.getElementById('jobState').value,sent,interviews});log('Vaga atualizada',`${j.client} · ${j.title}`);closeModal();render();toast('Vaga atualizada no protótipo.')}function jobForm(copyId,fromForm=false){let j=copyId?state.jobs.find(x=>x.id===copyId):{title:fromForm?'Assistente financeiro':'',client:'Amorim',salary:fromForm?2600:'',value:fromForm?1900:'',quantity:1,req:fromForm?'Experiência em contas a pagar e receber. Excel intermediário.':''};modal(copyId?'Repetir vaga':fromForm?'Simular briefing recebido':'Nova vaga',`${copyId?'<div class="notice">Os requisitos foram recuperados. Confirme salário e condições com o cliente antes de abrir a nova vaga.</div>':fromForm?'<div class="notice">Exemplo de resposta do Google Forms. Ao simular, estes dados viram uma vaga e um aviso para a assistente.</div>':''}<form onsubmit="event.preventDefault();createJob(${!!copyId},${fromForm})"><label>Cliente</label><select id="jc">${clients.map(c=>`<option ${j.client===c?'selected':''}>${c}</option>`).join('')}</select><label>Nome da vaga</label><input id="jt" required value="${esc(j.title)}" placeholder="Ex.: Analista de RH"><div class="fieldgrid"><div><label>Salário (R$)</label><input id="js" type="number" min="0" required value="${j.salary}"></div><div><label>Valor cobrado por vaga (R$)</label><input id="jv" type="number" min="0" required value="${j.value}"></div></div><label>Quantidade de posições</label><input id="jq" type="number" min="1" required value="${j.quantity}"><label>Requisitos</label><textarea id="jr" required>${esc(j.req)}</textarea>${copyId?'<label><input type="checkbox" required style="width:auto"> Confirmei as informações com o cliente nesta simulação.</label>':''}<div class="modalactions"><button class="btn primary" type="submit">${fromForm?'Simular envio do formulário':copyId?'Criar cópia confirmada':'Criar vaga'}</button></div></form>`)}
function createJob(copy,fromForm){let g=id=>document.getElementById(id).value;let j={id:Date.now(),title:g('jt').trim(),client:g('jc'),salary:+g('js'),value:+g('jv'),quantity:+g('jq'),req:g('jr').trim(),status:'Aberta',date:'2026-10-24',sent:0,interviews:0};if(!j.title||!j.req)return toast('Preencha título e requisitos.');state.jobs.unshift(j);log(fromForm?'Briefing recebido → vaga criada → aviso para Lari':copy?'Vaga repetida com briefing confirmado':'Nova vaga criada',j.client+' · '+j.title);view='jobs';render();if(fromForm)modal('Briefing recebido. Tudo organizado.',`<div class="success"><h3>✓ Vaga criada automaticamente na simulação</h3><p>${esc(j.title)} · ${esc(j.client)} · Status: Aberta</p></div><div class="step"><div class="stepnum">1</div><div><h3>Formulário recebido</h3><p>Cliente, salário e requisitos foram identificados.</p></div></div><div class="step"><div class="stepnum">2</div><div><h3>Cadastro completo</h3><p>A vaga já aparece no quadro de recrutamento.</p></div></div><div class="chat"><small>AVISO SIMULADO À ASSISTENTE</small>Lari, chegou uma nova vaga de ${esc(j.client)}: ${esc(j.title)}. O briefing já está disponível para conferir.</div>${btn('Abrir a vaga criada',`jobDetail(${j.id})`,true,'arrow')}`);else{closeModal();toast(copy?'Vaga duplicada. A original foi preservada.':'Nova vaga criada.')}}

function saveMeeting(id){let g=i=>document.getElementById(i).value;let m={id:id||Date.now(),client:g('mc'),date:g('md'),topic:g('mt').trim(),summary:g('ms').trim(),tool:g('mf'),next:g('mn'),status:g('mst')};if(!m.topic||!m.summary)return toast('Preencha a pauta e o resumo.');if(id)state.meetings[state.meetings.findIndex(x=>x.id===id)]=m;else state.meetings.unshift(m);log('Encontro registrado e revisado',m.client+' · '+m.topic);save();closeModal();render();toast('Histórico da empresa atualizado.')}function trainingForm(){modal('Novo treinamento',`<form onsubmit="event.preventDefault();saveTraining()"><label>Empresa</label><select id="tc">${clients.map(c=>`<option>${c}</option>`).join('')}</select><label>Tema</label><input id="tt" required><div class="fieldgrid"><div><label>Data</label><input id="td" type="date" required value="2026-10-28"></div><div><label>Participantes</label><input id="tp" required type="number" min="1" value="10"></div></div><label>Local</label><input id="tl" required><label>Material usado</label><input id="tm" required><div class="modalactions"><button class="btn primary">Salvar treinamento</button></div></form>`)}function saveTraining(){let g=i=>document.getElementById(i).value;state.trainings.unshift({client:g('tc'),topic:g('tt'),date:g('td'),people:+g('tp'),place:g('tl'),material:g('tm'),status:'Agendado'});log('Treinamento agendado',g('tc')+' · '+g('tt'));closeModal();render();toast('Treinamento adicionado.')}function trainingDetail(i){let t=state.trainings[i];modal('Detalhes do treinamento',`<span class="badge">${esc(t.client)}</span><h2 style="margin:24px 0 12px">${esc(t.topic)}</h2><p>${esc(t.place)} · ${date(t.date)}</p><div class="chat">${t.people} participantes<br>Material: ${esc(t.material)}</div>${badge(t.status)}<div class="modalactions">${btn(t.status==='Agendado'?'Marcar como realizado':'Voltar para agendado',`state.trainings[${i}].status='${t.status==='Agendado'?'Realizado':'Agendado'}';save();closeModal();render();toast('Situação function makeReport(){let c=document.getElementById('reportClient').value,a=document.getElementById('reportStart').value,b=document.getElementById('reportEnd').value;if(!a||!b||a>b)return toast('Escolha um período válido.');reportFor(c,a,b)}function reportFor(c,a,b){let inside=x=>x.client===c&&x.date>=a&&x.date<=b,js=state.jobs.filter(inside),ms=state.meetings.filter(inside),ts=state.trainings.filter(inside);modal('Relatório pronto para visualizar',`<div class="report"><div class="eyebrow">ÔMEGA · RELATÓRIO DEMONSTRATIVO</div><h2>${c} · Atividades realizadas</h2><p>${date(a)} a ${date(b)}</p><div class="stats" style="margin-top:24px">${stat('Vagas',js.length,'No período','jobs')}${stat('Encontros',ms.filter(x=>x.status!=='Falta').length,`${ms.filter(x=>x.status==='Falta').length} falta(s)`,'calendar')}${stat('Treinamentos',ts.filter(x=>x.status==='Realizado').length,'Realizados','training')}</div><h3>Histórico de consultoria</h3><div class="timeline">${ms.sort((a,b)=>b.date.localeCompare(a.date)).map(m=>`<div><div class="eyebrow">${date(m.date)} · ${m.status}</div><h3>${esc(m.topic)}</h3><p>${esc(m.summary)}</p><p>Ferramenta: ${esc(m.tool)}<br>Próximo passo: ${esc(m.next)}</p></div>`).join('')||'<p>Sem encontros neste período.</p>'}</div><h3>Recrutamento</h3>${js.map(j=>`<div class="minirow"><span>${esc(j.title)} · ${j.quantity} posição(ões)</span>${badge(j.status)}</div>`).join('')||'<p>Sem vagas neste período.</p>'}<h3 style="margin-top:24px">Treinamentos</h3>${ts.map(t=>`<p>${date(t.date)} · ${esc(t.topic)} · ${t.people} participantes · ${t.status}</p>`).join('')||'<p>Sem treinamentos neste período.</p>'}<p style="margin-top:28px;font-size:10px">Documento ilustrativo gerado pelo protótipo Ômega.</p></div><div class="modalactions">${btn('Imprimir / salvar PDF','window.print()',true,'report')}</div>`)}
function docDetail(i){let d=docs[i];modal(d.name,`<div class="report"><div class="eyebrow">ÔMEGA · MODELO DEMONSTRATIVO · ${d.cat}</div><h2>${d.name}</h2><p>${d.desc}</p>${['Empresa / responsável','Data e objetivo','Observações e evidências','Ações combinadas','Responsável e prazo'].map(s=>`<div style="margin-top:26px"><h3>${s}</h3><div style="height:45px;border-bottom:1px solid #ddd"></div></div>`).join('')}<p style="font-size:10px;margin-top:20px">Modelo ilustrativo para testar a organização da biblioteca.</p></div><div class="modalactions">${btn('Baixar modelo HTML',`downloadDoc(${i})`,false,'report')}${btn('Imprimir / salvar PDF','window.print()',true,'report')}</div>`)}function downloadDoc(i){let d=docs[i],html='<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>'+d.name+'</title><style>body{font-family:Arial;max-width:750px;margin:60px auto;color:#222}section{height:110px;border-bottom:1px solid #ccc}</style><h1>Ômega · '+d.name+'</h1><p>Modelo demonstrativo. '+d.desc+'</p>'+['Empresa / responsável','Data e objetivo','Observações e evidências','Ações combinadas','Responsável e prazo'].map(x=>'<section><h3>'+x+'</h3></section>').join('')+'</html>';let a=document.createElement('a'),u=URL.createObjectURL(new Blob([html],{type:'text/html;charset=utf-8'}));a.href=u;a.download=d.name.toLowerCase().replaceAll(' ','-')+'.html';a.click();URL.revokeObjectURL(u);toast('Modelo demonstrativo baixado.')}function notifications(){modal('Central de avisos',`<div class="notice">Avisos demonstrativos. As ações feitas por você aparecem aqui.</div>${state.logs.length?state.logs.slice(0,10).map(l=>`<div class="chat"><h3>${esc(l.t)}</h3><p>${esc(l.d)}</p></div>`).join(''):'<div class="chat"><h3>Relato aguardando revisão</h3><p>Amorim · Desenvolvimento da liderança</p>'+btn('Revisar relato','meetingDetail(1)',true)+'</div>'}`)}function resetDemo(){modal('Reiniciar a demonstração?',`<p>Isso remove apenas as alterações feitas neste navegador e restaura os exemplos iniciais.</p><div class="modalactions">${btn('Cancelar','closeModal()')}${btn('Reiniciar',"state=structuredClone(initial);save();closeModal();go('dashboard');toast('Demonstração reiniciada.')",true)}</div>`)}render();

dashboard=function(){let j=monthJobs(),m=monthMeet(),closed=j.filter(x=>x.status==='Fechada'),done=m.filter(x=>x.status==='Registrado'),pending=state.meetings.filter(x=>x.status==='A revisar').length+state.jobs.filter(x=>x.pendingConfirm).length;return intro('SIMPLES DE USAR. FÁCIL DE ACOMPANHAR.','Seu dia começa organizado.','Veja o que precisa de você e resolva direto daqui.',monthPicker())+quickTiles()+`<div class="stats">${stat('Processos no mês',j.length,`${j.reduce((s,x)=>s+x.quantity,0)} posições · ${closed.length} processos fechados`,'jobs')}${stat('Valor contratado',money(closed.reduce((s,x)=>s+x.value*x.quantity,0)),'Vagas fechadas · não indica recebimento','money')}${stat('Visitas confirmadas',done.length,`${m.filter(x=>x.status==='A revisar').length} relato(s) ainda em revisão`,'calendar')}${stat('Ações pendentes',pending,'Briefings e relatos em um só lugar','clock')}</div><div class="grid">${pendingPanel()}<section class="card bluehero"><div><div class="eyebrow">EXPERIMENTE EM UM CLIQUE</div><h2>O briefing chega.<br>A vaga se organiza.</h2><p>Veja um formulário de exemplo criar uma vaga, uma pendência e um registro no histórico.</p><div class="heroSteps"><span>Formulário</span>→<span>Vaga aberta</span>→<span>Sua revisão</span></div></div>${btn('Simular novo briefing','simulate(0)',false,'bolt')}<p style="font-size:10px;margin:14px 0 0">Simulação local. Nenhuma mensagem é enviada.</p></section></div><div class="grid"><section class="card">${head('Recrutamento do mês','Processos por etapa.',link('Gerenciar vagas','jobs'))}<div class="funnel">${['Aberta','Em andamento','Fechada'].map(s=>`<div class="funnelrow"><span>${s==='Aberta'?'Abertos':s==='Fechada'?'Fechados':s}</span><div class="bartrack"><div class="bar" style="width:${j.length?j.filter(x=>x.status===s).length/j.length*100:0}%"></div></div><b>${j.filter(x=>x.status===s).length}</b></div>`).join('')}</div><div class="cardfooter"><span>Status alterado no quadro → painel atualizado</span></div></section><section class="card">${head('Próximos treinamentos','Tudo pronto para planejar a entrega.',link('Ver todos','training'))}${state.trainings.filter(t=>t.status==='Agendado').sort((a,b)=>a.date.localeCompare(b.date)).slice(0,2).map(t=>`<div class="activity"><div class="symbol">${ic('training')}</div><div><strong>${esc(t.topic)}</strong><small>${esc(t.client)} · ${date(t.date)} · ${t.people} participantes</small></div></div>`).join('')||'<div class="blankok">Nenhum treinamento agendado.</div>'}</section></div><section class="card">${head('O que acabou de acontecer','Cada ação deixa um histórico para você acompanhar.',link('Ver automações','automations'))}${(state.logs.length?state.logs.slice(0,4):[{t:'Demonstração pronta para explorar',d:'Crie uma vaga, confirme um relato ou simule um briefing.'}]).map(l=>`<div class="activity"><div class="symbol">${ic('check')}</div><div><strong>${esc(l.t)}</strong><small>${esc(l.d)}</small></div><time>Protótipo</time></div>`).join('')}</section>`};

function nextJob(id){const j=state.jobs.find(x=>x.id===id);if(!j)return;if(j.pendingConfirm)return toast('Confira o briefing e marque como confirmado antes de avançar.');if(j.status==='Fechada')return;remember();j.status=j.status==='Aberta'?'Em andamento':'Fechada';completeAction(j.status==='Fechada'?'Vaga fechada. Painel e histórico atualizados.':'Seleção iniciada. A vaga avançou no quadro.','Status atualizado: '+j.status,j.client+' · '+j.title)}

jobBoard=function(){let all=state.jobs.filter(j=>(!jobStatus||j.status===jobStatus)&&(j.title+' '+j.client).toLowerCase().includes(query.toLowerCase()));return `<div class="kanban">${['Aberta','Em andamento','Fechada'].map(s=>`<section class="column"><div class="colhead"><span>${s==='Aberta'?'Abertas':s==='Fechada'?'Fechadas':s}</span><b>${all.filter(j=>j.status===s).length}</b></div>${all.filter(j=>j.status===s).map(j=>`<article class="job"><span class="badge">${esc(j.client)}</span><button class="jobtitle" onclick="jobDetail(${j.id})">${esc(j.title)}</button><p>${j.salary?money(j.salary):'Salário a definir'} · ${j.quantity} ${j.quantity>1?'posições':'posição'}</p>${j.pendingConfirm?'<div style="margin-top:12px"><span class="badge pending">Conferir briefing com o cliente</span></div>':''}<div class="jobbottom"><span>${j.interviews} entrevistas</span><span>${j.value?money(j.value)+' / vaga':'Valor a definir'}</span></div><div class="jobactions">${j.pendingConfirm?btn('Briefing confirmado',`confirmBrief(${j.id})`,true,'check'):j.status!=='Fechada'?btn(j.status==='Aberta'?'Iniciar seleção':'Fechar vaga',`nextJob(${j.id})`,true,'arrow'):btn('Repetir vaga',`duplicateQuick(${j.id})`,true,'copy')}${btn('Detalhes',`jobDetail(${j.id})`)}</div></article>`).join('')||'<p class="empty">Nenhuma vaga nesta etapa.</p>'}</section>`).join('')}</div>`};
jobDetail=function(id){originalJobDetail(id);let j=state.jobs.find(x=>x.id===id);const body=document.querySelector('.modalbody');if(j.pendingConfirm)body.insertAdjacentHTML('afterbegin','<div class="notice">Briefing pendente de confirmação com o cliente. Depois de conferir as informações, confirme no quadro para iniciar a seleção.</div>');let copy=document.querySelector('.modalactions .btn');copy.textContent='Repetir em 1 clique';copy.setAttribute('onclick',`duplicateQuick(${id})`);if(j.pendingConfirm)document.getElementById('jobState').disabled=true};
jobForm=function(copyId,fromForm=false){if(copyId)return duplicateQuick(copyId);if(fromForm)return simulate(0);let suggested=clientFilter||clients[0];modal('Nova vaga, sem complicação',`<p>Comece com o essencial. Você pode completar os detalhes depois.</p><form onsubmit="event.preventDefault();quickCreateJob()"><label>Cliente</label><select id="qjc">${clients.map(c=>`<option ${c===suggested?'selected':''}>${c}</option>`).join('')}</select><label>Qual é a vaga?</label><input id="qjt" required placeholder="Ex.: Analista de RH" autocomplete="off"><div class="fieldgrid"><div><label>Salário (opcional)</label><input id="qjs" type="number" min="0" step="0.01" placeholder="A definir"></div><div><label>Valor por vaga (opcional)</label><input id="qjv" type="number" min="0" step="0.01" placeholder="A definir"></div></div><details class="optional"><summary>Adicionar requisitos e quantidade</summary><label>Quantidade de posições</label><input id="qjq" type="number" min="1" step="1" value="1"><label>Requisitos</label><textarea id="qjr" placeholder="Você pode preencher depois."></textarea></details><div class="resultbox">Ao salvar: vaga aberta + pendência de confirmação + painel atualizado. A data é preenchida automaticamente.</div><div class="modalactions"><button type="submit" class="btn primary">Criar vaga</button></div></form>`)};
function quickCreateJob(){let g=i=>document.getElementById(i).value;let title=g('qjt').trim(),quantity=+g('qjq');if(!title||!Number.isInteger(quantity)||quantity<1)return toast('Informe o nome e uma quantidade válida.');remember();let j={id:newId(state.jobs),title,client:g('qjc'),salary:+g('qjs')||0,value:+g('qjv')||0,quantity,req:g('qjr').trim()||'A completar com o cliente.',status:'Aberta',date:today(),sent:0,interviews:0,pendingConfirm:true};state.jobs.unshift(j);month=j.date.slice(0,7);closeModal();view='jobs';completeAction('Vaga criada. Agora confirme o briefing.','Nova vaga organizada',j.client+' · '+j.title)}
function reviewMeeting(id){const m=state.meetings.find(x=>x.id===id);if(!m)return;modal(`Revisar relato · ${esc(m.client)}`,`<div class="notice">${date(m.date)} · Leia o resumo e confirme em um clique. Edite apenas se algo precisar mudar.</div>${[['Pauta',m.topic],['O que foi conversado',m.summary],['Ferramenta aplicada',m.tool],['Próximo passo',m.next]].map(([k,v])=>`<div class="reviewBlock"><div class="eyebrow">${k}</div><p>${esc(v||'Não informado')}</p></div>`).join('')}<div class="modalactions">${btn('Ajustar informações',`originalMeetingForm(${id})`)}${btn('Confirmar registro',`approveMeeting(${id})`,true,'check')}</div>`)}
function approveMeeting(id){const m=state.meetings.find(x=>x.id===id);if(!m||m.status!=='A revisar')return;remember();m.status='Registrado';if(m.id===1)state.tasks[0]=true;closeModal();completeAction('Relato confirmado. Histórico e indicadores atualizados.','Consultoria revisada',m.client+' · '+m.topic)}
meetingDetail=function(id){const m=state.meetings.find(x=>x.id===id);if(m?.status==='A revisar')reviewMeeting(id);else originalMeetingForm(id)};
meetingForm=function(id,sim=false){if(id)return originalMeetingForm(id);if(sim)return simulate(2);modal('Registrar o encontro',`<p>Conte o que aconteceu. O registro já fica ligado à empresa.</p><form onsubmit="event.preventDefault();quickCreateMeeting()"><div class="fieldgrid"><div><label>Cliente</label><select id="qmc">${clients.map(c=>`<option ${c===clientFilter?'selected':''}>${c}</option>`).join('')}</select></div><div><label>Data</label><input id="qmd" type="date" required value="${today()}"></div></div><label>O que aconteceu no encontro?</label><textarea id="qms" required placeholder="Ex.: Trabalhamos feedback com a equipe e combinamos revisar os planos de ação na próxima visita." style="min-height:135px"></textarea><details class="optional"><summary>Adicionar pauta, ferramenta e próximo passo</summary><label>Pauta (opcional)</label><input id="qmt" placeholder="Encontro de consultoria"><label>Ferramenta (opcional)</label><input id="qmf" list="toolOptions"><datalist id="toolOptions">${docs.map(d=>`<option value="${esc(d.name)}">`).join('')}</datalist><label>Próximo passo (opcional)</label><textarea id="qmn" placeholder="Qual ação ficou combinada?"></textarea></details><div class="resultbox">Data sugerida automaticamente. O seu texto será salvo integralmente no histórico da empresa.</div><div class="modalactions"><button class="btn primary" type="submit">Salvar encontro confirmado</button></div></form>`)};
function quickCreateMeeting(){let g=i=>document.getElementById(i).value;const summary=g('qms').trim();if(!summary)return toast('Conte o que aconteceu no encontro.');remember();let m={id:newId(state.meetings),client:g('qmc'),date:g('qmd'),topic:g('qmt').trim()||'Encontro de consultoria',summary,tool:g('qmf').trim()||'Não informada',next:g('qmn').trim()||'A definir',status:'Registrado'};state.meetings.unshift(m);month=m.date.slice(0,7);closeModal();view='meetings';completeAction('Encontro salvo. O histórico já foi atualizado.','Visita registrada',m.client+' · '+m.topic)}
function period(){let [y,m]=month.split('-').map(Number);return {a:month+'-01',b:month+'-'+new Date(y,m,0).getDate()}}
reports=function(){let p=period();return intro('PRONTO PARA MOSTRAR O TRABALHO','Escolha a empresa. O relatório já está pronto.','Os registros confirmados são reunidos automaticamente por período.',monthPicker())+`<div class="helpnote">Atalho: clique em uma empresa para abrir o relatório do mês. Relatos em revisão ficam de fora até serem confirmados.</div><div class="reportcards">${clients.map(c=>`<button class="btn" onclick="reportFor('${c}','${p.a}','${p.b}')"><span class="badge">RELATÓRIO MENSAL</span><b>${c} ${ic('arrow').replace('<svg','<svg style="float:right;width:17px;height:17px"')}</b><small>Abrir com os dados deste mês</small></button>`).join('')}</div><section class="card wide" style="margin-top:25px"><h2>Precisa de outro período?</h2><div class="toolbar" style="margin:22px 0 0"><select id="reportClient" aria-label="Cliente do relatório">${clients.map(c=>`<option>${c}</option>`).join('')}</select><input type="date" id="reportStart" aria-label="Data inicial" value="${p.a}"><input type="date" id="reportEnd" aria-label="Data final" value="${p.b}">${btn('Gerar relatório','makeReport()',true,'report')}</div></section>`};
reportFor=function(c,a,b){const pending=state.meetings.filter(m=>m.client===c&&m.date>=a&&m.date<=b&&m.status==='A revisar').length;const all=state.meetings;try{state.meetings=all.filter(x=>x.status!=='A revisar');originalReportFor(c,a,b)}finally{state.meetings=all}if(pending)document.querySelector('.modalbody').insertAdjacentHTML('afterbegin',`<div class="notice">${pending} relato(s) em revisão não incluído(s). Confirme na aba Consultorias para entrar no relatório.</div>`)};
function receiveDemoBrief(){remember();let j={id:newId(state.jobs),client:'Amorim',title:'Assistente financeiro',salary:2600,value:1900,quantity:1,req:'Experiência em contas a pagar e receber. Excel intermediário.',status:'Aberta',date:today(),sent:0,interviews:0,pendingConfirm:true};state.jobs.unshift(j);month=j.date.slice(0,7);completeAction('Briefing recebido. Vaga e pendência criadas.','SIMULAÇÃO · briefing recebido e vaga criada','Amorim · Assistente financeiro · aviso ilustrativo para Lari');modal('Tudo chegou ao lugar certo.',`<span class="badge">SIMULAÇÃO CONCLUÍDA</span><h2 style="margin:22px 0 10px">Assistente financeiro · Amorim</h2><p>O formulário de exemplo virou uma vaga aberta, com salário, valor e requisitos preenchidos.</p><div class="step"><div class="stepnum">✓</div><div><h3>Vaga criada e painel atualizado</h3><p>Os números e o histórico já refletem este novo processo.</p></div></div><div class="step"><div class="stepnum">✓</div><div><h3>Pendência adicionada à sua rotina</h3><p>Confira as condições com o cliente antes de iniciar.</p></div></div><div class="chat"><small>PRÉVIA DO AVISO · NENHUMA MENSAGEM ENVIADA</small>Lari, chegou uma nova vaga da Amorim: Assistente financeiro. O briefing está organizado e pronto para conferir.</div><div class="modalactions">${btn('Conferir detalhes',`jobDetail(${j.id})`)}${btn('Ver no quadro',"closeModal();go('jobs')",true,'arrow')}</div>`)}
function receiveDemoMeeting(){remember();const m={id:newId(state.meetings),client:'Amorim',date:today(),topic:'Liderança e feedback',summary:'A equipe discutiu dificuldades em dar feedback e combinou preparar planos de ação individuais.',tool:'Roda de competências',next:'Revisar os planos de ação na próxima visita.',status:'A revisar'};state.meetings.unshift(m);completeAction('Exemplo de relato preparado para revisão.','SIMULAÇÃO · relato pós-encontro organizado','Amorim · liderança e feedback');reviewMeeting(m.id);document.querySelector('.modalbody').insertAdjacentHTML('afterbegin','<div class="notice">Exemplo pronto: Agenda → pergunta no WhatsApp → resumo estruturado. Não houve envio, leitura de áudio ou uso real de IA.</div>')}
simulate=function(i){if(!state.auto[i])return toast('Habilite este fluxo em Automações para testar.');if(i===0)return receiveDemoBrief();if(i===2)return receiveDemoMeeting();if(i===5)return go('reports');return originalSimulate(i)};

flows[0][3]='Receber briefing de exemplo';flows[1][3]='Repetir vaga em 1 clique';flows[2][3]='Receber relato para revisão';flows[5][3]='Abrir relatório do mês';
